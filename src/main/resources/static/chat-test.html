<!DOCTYPE html>
<html>
<head>
    <title>ChatApp</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<h2>ChatApp</h2>

<!-- Login Section -->
<div>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
</div>

<hr/>

<!-- Online Users -->
<h3>Online Users</h3>
<ul id="onlineUsers"></ul>

<hr/>

<!-- Chat Section -->
<input id="receiver" placeholder="Receiver Username" />
<br/><br/>
<input id="messageInput" placeholder="Type message..." />
<div id="typingIndicator" style="color: gray;"></div>
<button onclick="sendMessage()">Send</button>
<button onclick="loadChatHistory()">Load History</button>

<ul id="messages"></ul>

<script>

    var stompClient = null;

    // LOGIN FUNCTION
    function login() {
        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;

        fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        })
        .then(response => response.text())
        .then(token => {
            if (!token || token.length < 20) {
                alert("Login failed");
                return;
            }

            localStorage.setItem("token", token);
            alert("Login successful");
            connectWebSocket();
        })
        .catch(error => {
            console.error("Login error:", error);
        });
    }

    // CONNECT WEBSOCKET AFTER LOGIN
    function connectWebSocket() {
        var token = localStorage.getItem("token");

        if (!token) {
            alert("No token found. Please login first.");
            return;
        }

        var socket = new SockJS("/chat");
        stompClient = Stomp.over(socket);

        stompClient.connect(
            {
                Authorization: "Bearer " + token
            },
            function () {
                console.log("WebSocket connected with JWT");

                // Subscribe to private messages
                stompClient.subscribe("/user/queue/messages", function (message) {
                    var chatMessage = JSON.parse(message.body);

                    var li = document.createElement("li");
                    li.textContent = chatMessage.sender + ": " + chatMessage.content;
                    document.getElementById("messages").appendChild(li);
                });

                // Subscribe to online users list
                stompClient.subscribe("/topic/online-users", function (message) {
                    var users = JSON.parse(message.body);
                    var list = document.getElementById("onlineUsers");
                    list.innerHTML = "";

                    users.forEach(function(user) {
                        var li = document.createElement("li");
                        li.textContent = user;
                        list.appendChild(li);
                    });
                });

                // Subscribe to typing indicator
                stompClient.subscribe("/user/queue/typing", function(message) {
                    document.getElementById("typingIndicator").innerText = message.body;

                    setTimeout(function() {
                        document.getElementById("typingIndicator").innerText = "";
                    }, 2000);
                });
            },
            function (error) {
                console.error("WebSocket connection error:", error);
            }
        );
    }

    // SEND PRIVATE MESSAGE
    function sendMessage() {

        if (!stompClient || !stompClient.connected) {
            alert("WebSocket not connected yet.");
            return;
        }

        var content = document.getElementById("messageInput").value;
        var receiver = document.getElementById("receiver").value;

        if (!receiver || !content) {
            alert("Receiver and message required");
            return;
        }

        stompClient.send("/app/private-message", {}, JSON.stringify({
            receiver: receiver,
            content: content
        }));

        document.getElementById("messageInput").value = "";
    }

    //chat history
    function loadChatHistory() {

        var receiver = document.getElementById("receiver").value;
        var token = localStorage.getItem("token");

        console.log("Receiver:", receiver);
        console.log("Token:", token);

        fetch("/api/chat/history/" + receiver, {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
            .then(response => {
                console.log("Status:", response.status);
                return response.json();
            })
            .then(messages => {

                console.log("Messages received:", messages);

                const list = document.getElementById("messages");

                if (!list) {
                    console.error("UL element not found!");
                    return;
                }

                list.innerHTML = "";

                if (!messages || messages.length === 0) {
                    list.innerHTML = "<li>No messages found</li>";
                    return;
                }

                messages.forEach(msg => {
                    console.log("Rendering:", msg);

                    const li = document.createElement("li");
                    li.textContent = msg.sender + " : " + msg.content;
                    list.appendChild(li);
                });
            })
            .catch(error => {
                console.error("History error:", error);
            });
    }

    //typing event
    document.getElementById("messageInput").addEventListener("input", function() {

        var receiver = document.getElementById("receiver").value;

        if (!receiver || !stompClient || !stompClient.connected) return;

        stompClient.send("/app/typing", {}, JSON.stringify({
            receiver: receiver
        }));
    });

    window.onload = function() {
        if (localStorage.getItem("token")) {
            connectWebSocket();
        }
    };
</script>

</body>
</html>
