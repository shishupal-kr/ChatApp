<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ChatApp</title>

    <link rel="stylesheet" href="/chat-style.css">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        ChatApp
    </div>

    <div class="chat-login">
        <input id="username" placeholder="Username" />
        <input id="password" type="password" placeholder="Password" />
        <button onclick="login()">Login</button>
    </div>

    <div id="messages" class="chat-messages"></div>

    <div class="chat-input">
        <input id="receiver" placeholder="Receiver Username" />
        <input id="messageInput" placeholder="Type message..." />
        <button onclick="sendMessage()">Send</button>
        <button onclick="loadChatHistory()">History</button>
    </div>

    <div id="typingIndicator" class="typing-indicator"></div>

</div>

<script>

    var stompClient = null;
    var currentUser = null;

    function login() {
        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;

        fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(response => response.text())
        .then(token => {
            if (!token || token.length < 20) {
                alert("Login failed");
                return;
            }

            localStorage.setItem("token", token);
            currentUser = username;
            // Show login success message
            alert("Logged in as " + username);
            connectWebSocket();
        });
    }

    function connectWebSocket() {
        if (stompClient && stompClient.connected) return;

        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        var token = localStorage.getItem("token");

        stompClient.connect({ Authorization: "Bearer " + token }, function () {

            stompClient.subscribe("/user/queue/messages", function (message) {
                var chatMessage = JSON.parse(message.body);
                renderMessage(chatMessage);
            });

            // Auto-load history when receiver field changes
            document.getElementById("receiver").addEventListener("change", function() {
                if (this.value) {
                    loadChatHistory();
                }
            });

            // If receiver already filled before login, load immediately
            var receiver = document.getElementById("receiver").value;
            if (receiver) {
                loadChatHistory();
            }
        });
    }

    function renderMessage(chatMessage) {
        var messageDiv = document.createElement("div");
        messageDiv.classList.add("message");

        if (chatMessage.sender === currentUser) {
            messageDiv.classList.add("sent");
        } else {
            messageDiv.classList.add("received");
        }

        messageDiv.innerText = chatMessage.content;

        var container = document.getElementById("messages");
        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
        if (!stompClient || !stompClient.connected) return;

        var content = document.getElementById("messageInput").value;
        var receiver = document.getElementById("receiver").value;

        if (!receiver || !content) return;

        stompClient.send("/app/private-message", {}, JSON.stringify({
            receiver: receiver,
            content: content
        }));

        document.getElementById("messageInput").value = "";
    }

    function loadChatHistory() {
        var receiver = document.getElementById("receiver").value;
        var token = localStorage.getItem("token");

        fetch("/api/chat/history/" + receiver, {
            method: "GET",
            headers: { "Authorization": "Bearer " + token }
        })
        .then(response => response.json())
        .then(messages => {
            var container = document.getElementById("messages");
            container.innerHTML = "";
            messages.forEach(msg => renderMessage(msg));
        });
    }

    document.getElementById("messageInput").addEventListener("input", function() {
        var receiver = document.getElementById("receiver").value;
        if (!receiver || !stompClient || !stompClient.connected) return;

        stompClient.send("/app/typing", {}, JSON.stringify({ receiver: receiver }));
    });

</script>

</body>
</html>
