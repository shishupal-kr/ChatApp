<!DOCTYPE html >
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - ChatApp</title>
    <link rel="stylesheet" href="/chat-style.css">
</head>
<body>

<div class="login-wrapper">

    <div class="login-card">
        <h2 class="login-title">ChatApp</h2>
        <p class="login-subtitle">Sign in to continue</p>

        <input id="username" class="login-input" placeholder="Username">
        <input id="password" class="login-input" type="password" placeholder="Password">

        <button class="login-button" onclick="login()">Login</button>
        <button class="register-button" onclick="goToRegister()">Create New Account</button>
    </div>

</div>

<script>
    function login() {

        var username = document.getElementById("username").value;
        var password = document.getElementById("password").value;

        fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({username, password})
        })
        .then(res => res.text())
        .then(token => {

            if (!token || token.length < 20) {
                alert("Login failed");
                return;
            }

            localStorage.setItem("token", token);
            localStorage.setItem("username", username);

            window.location.href = "/friends.html";
        });
    }

    function goToRegister() {
        window.location.href = "/register.html";
    }
</script>

</body>
</html>
