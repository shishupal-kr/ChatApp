<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Friends - ChatApp</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/friends.css">
  <script src="/js/analytics.js"></script>
  <script src="/js/auth.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js" defer></script>
  <script src="/js/friends.js" defer></script>
</head>
<body>

<div class="friends-container app-panel">

  <div class="friends-header">
    <span>Chats</span>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text"
             id="searchBox"
             placeholder="Search user..."
             onkeyup="handleSearchKey(event)">
    </div>
  </div>

  <div id="friendList" class="friend-list">
    <div class="empty-state">No friends online</div>
  </div>

  <nav class="app-bottom-nav" aria-label="Primary">
    <a class="app-nav-item" href="/html/friends.html" onclick="return openChatTab(event)">
      <span class="app-nav-icon">💬</span>
      <span class="app-nav-label">Chat</span>
    </a>
    <a class="app-nav-item active" href="/html/friends.html">
      <span class="app-nav-icon">👥</span>
      <span class="app-nav-label">Friends</span>
    </a>
    <a class="app-nav-item" href="/html/profile.html">
      <span class="app-nav-icon">👤</span>
      <span class="app-nav-label">Profile</span>
    </a>
    <a class="app-nav-item" href="/html/settings.html">
      <span class="app-nav-icon">⚙️</span>
      <span class="app-nav-label">Settings</span>
    </a>
  </nav>

</div>

</body>
</html>
