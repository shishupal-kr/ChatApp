<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Friends - ChatApp</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/friends.css">
  <script src="/js/analytics.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app-shell.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js" defer></script>
  <script src="/js/friends.js" defer></script>
</head>
<body class="edge" data-nav="friends">

<div class="friends-page shell shell-edge">

  <div class="friends-header">
    <span class="friends-title">ChatApp</span>
    <button class="search-toggle" type="button" aria-label="Open search" aria-expanded="false" onclick="toggleSearch()">
      <span class="search-toggle-icon">🔍</span>
    </button>
  </div>

  <div id="searchPanel" class="search-panel" aria-hidden="true">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text"
             id="searchBox"
             placeholder="Search Username to Chat..."
             onkeyup="handleSearchKey(event)">
    </div>
  </div>

  <div id="friendList" class="friend-list">
    <div class="empty-state">No friends online</div>
  </div>

  <div data-app-nav></div>

</div>

</body>
</html>
