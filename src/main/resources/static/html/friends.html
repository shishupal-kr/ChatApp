<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Friends - ChatApp</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/friends.css">
  <script src="/js/analytics.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js" defer></script>
  <script src="/js/friends.js" defer></script>
</head>
<body>

<div class="friends-container app-panel">

  <div class="friends-header">
    <span>Chats</span>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text"
             id="searchBox"
             placeholder="Search user..."
             onkeyup="handleSearchKey(event)">
    </div>

    <div class="menu-wrapper">
      <span class="menu-icon" onclick="toggleMenu()">⋮</span>
      <div class="menu-dropdown" id="menuDropdown">
        <div class="menu-item" onclick="openProfile()">Profile</div>
        <div class="menu-item" onclick="openSettings()">Settings</div>
        <div class="menu-item" onclick="logout()">Logout</div>
      </div>
    </div>
  </div>

  <div id="friendList" class="friend-list">
    <div class="empty-state">No friends online</div>
  </div>

</div>

</body>
</html>
