<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register - ChatApp</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/register.css">
    <script src="/js/analytics.js"></script>
    <script src="/js/app-shell.js" defer></script>
    <script src="/js/register.js" defer></script>
</head>
<body class="edge">

<div class="auth-wrap shell shell-edge">

    <div class="login-card">
        <div class="auth-head">
            <span onclick="goBack()" class="back-btn">❮</span>
            <h2>Create Account</h2>
        </div>

        <input id="firstName" placeholder="First Name">
        <input id="lastName" placeholder="Last Name">
        <input id="age" type="number" placeholder="Age">
        <select id="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <input id="username" placeholder="Username">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <input id="confirmPassword" type="password" placeholder="Confirm Password">

        <button type="button" onclick="register()">Register</button>
        <button type="button" class="auth-alt-btn" onclick="goToLogin()">Back to Login</button>

        <p id="errorMessage" style="color:red; font-size:13px; margin-top:10px;" aria-live="polite"></p>
    </div>

</div>

</body>
</html>
