<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Settings - ChatApp</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/settings.css?v=20260321">
    <script src="/js/analytics.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app-shell.js" defer></script>
    <script src="/js/settings.js" defer></script>
</head>
<body class="edge" data-nav="settings">

<div class="prefs-page shell shell-edge">

    <div class="prefs-top topbar">
        <span onclick="goBack()" class="back-btn back">❮</span>
        <span class="prefs-title top-title">Settings</span>
    </div>

    <div class="prefs-body">
        <div class="prefs-group">
            <div class="setting-row" onclick="window.location.href='profile.html'">
                <span class="row-icon">👤</span>
                <span class="row-text">
                    <span class="row-title">Profile</span>
                    <span class="row-sub">View your account details</span>
                </span>
                <span class="row-arrow">›</span>
            </div>
            <div class="setting-row" onclick="toggleTheme()">
                <span class="row-icon">🌓</span>
                <span class="row-text">
                    <span class="row-title">Theme</span>
                    <span class="row-sub">Dark / light mode</span>
                </span>
                <span class="row-arrow">›</span>
            </div>
            <div class="setting-row" onclick="showAbout()">
                <span class="row-icon">📱</span>
                <span class="row-text">
                    <span class="row-title">About App</span>
                    <span class="row-sub">App info and download links</span>
                </span>
                <span class="row-arrow">›</span>
            </div>
        </div>

        <div class="prefs-group">
            <div class="setting-row no-border">
                <span class="row-icon">🔐</span>
                <span class="row-text">
                    <span class="row-title">Current Password</span>
                    <span class="row-sub">Needed to confirm changes</span>
                </span>
            </div>
            <div class="field-block">
                <input class="setting-input" type="password" id="currentPassword" placeholder="Current password">
            </div>

            <div class="setting-row no-border">
                <span class="row-icon">✏</span>
                <span class="row-text">
                    <span class="row-title">Change Password</span>
                    <span class="row-sub">Update your login password</span>
                </span>
            </div>
            <div class="field-block">
                <input class="setting-input" type="password" id="newPassword" placeholder="New password">
                <button class="setting-btn" type="button" onclick="updatePassword()">Update</button>
            </div>

            <div class="setting-row no-border">
                <span class="row-icon">📧</span>
                <span class="row-text">
                    <span class="row-title">Change Email</span>
                    <span class="row-sub">Update your contact email</span>
                </span>
            </div>
            <div class="field-block">
                <input class="setting-input" type="email" id="newEmail" placeholder="New email">
                <button class="setting-btn" type="button" onclick="updateEmail()">Update</button>
            </div>
        </div>

        <div class="prefs-group danger-group">
            <div class="setting-row row-danger" onclick="logout()">
                <span class="row-icon">↩</span>
                <span class="row-text">
                    <span class="row-title">Logout</span>
                    <span class="row-sub">End this session on this device</span>
                </span>
                <span class="row-arrow">›</span>
            </div>
            <button class="danger-btn" type="button" onclick="deleteAccount()">
                <span>🗑</span>
                <span>Delete account</span>
            </button>
        </div>
    </div>

    <div data-app-nav></div>
</div>

</body>
</html>
