<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Settings - ChatApp</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/settings.css?v=20260321">
    <script src="/js/analytics.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app-shell.js" defer></script>
    <script src="/js/settings.js" defer></script>
</head>
<body class="edge" data-nav="settings">

<div class="prefs-page shell shell-edge">

    <div class="prefs-top topbar">
        <span onclick="goBack()" class="back-btn back">‹</span>
        <span class="prefs-title top-title">Settings</span>
    </div>

    <div class="prefs-body">

        <div class="prefs-group">
            <div class="setting-row" onclick="window.location.href='profile.html'">
                👤 Profile
            </div>
        </div>

        <div class="prefs-group">
            <div class="setting-row" onclick="toggleTheme()">
                🌓 Dark / Light Mode
            </div>
        </div>

        <div class="prefs-group">

            <div class="setting-row">
                ✏ Change Password
            </div>
            <input class="setting-input" type="password" id="newPassword">
            <button class="setting-btn">Update</button>

            <div class="setting-row">
                📧 Change Email
            </div>
            <input class="setting-input" type="email" id="newEmail">
            <button class="setting-btn">Update</button>

        </div>

        <div class="prefs-group">
            <div class="setting-row setting-btn danger" onclick="deleteAccount()">
                🗑 Delete Account
            </div>
        </div>

        <div class="prefs-group">
            <div class="setting-row row-danger" onclick="logout()">
                ↩ Logout
            </div>
        </div>

        <div class="prefs-group">
            <div class="setting-row" onclick="showAbout()">
                📱 About App
            </div>
        </div>

    </div>

    <div data-app-nav></div>
</div>

</body>
</html>
