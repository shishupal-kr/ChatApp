<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Settings - ChatApp</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/settings.css?v=20260321">
    <script src="/js/analytics.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/settings.js" defer></script>
</head>
<body>

<div class="settings-container app-panel">

    <div class="settings-header app-topbar">
        <span onclick="goBack()" class="back-btn app-back-btn">‹</span>
        <span class="settings-title app-topbar-title">Settings</span>
    </div>

    <div class="settings-content">

        <div class="settings-section">
            <div class="setting-row" onclick="window.location.href='profile.html'">
                👤 Profile
            </div>
        </div>

        <div class="settings-section">
            <div class="setting-row" onclick="toggleTheme()">
                🌓 Dark / Light Mode
            </div>
        </div>

        <div class="settings-section">

            <div class="setting-row">
                ✏ Change Password
            </div>
            <input class="setting-input" type="password" id="newPassword">
            <button class="setting-btn">Update</button>

            <div class="setting-row">
                📧 Change Email
            </div>
            <input class="setting-input" type="email" id="newEmail">
            <button class="setting-btn">Update</button>

        </div>

        <div class="settings-section">
            <div class="setting-row setting-btn danger" onclick="deleteAccount()">
                🗑 Delete Account
            </div>
        </div>

        <div class="settings-section">
            <div class="setting-row setting-row-danger" onclick="logout()">
                ↩ Logout
            </div>
        </div>

        <div class="settings-section">
            <div class="setting-row" onclick="showAbout()">
                📱 About App
            </div>
        </div>

    </div>

    <nav class="app-bottom-nav" aria-label="Primary">
        <a class="app-nav-item" href="/html/friends.html" onclick="return openChatTab(event)">
            <span class="app-nav-icon">💬</span>
            <span class="app-nav-label">Chat</span>
        </a>
        <a class="app-nav-item" href="/html/friends.html">
            <span class="app-nav-icon">👥</span>
            <span class="app-nav-label">Friends</span>
        </a>
        <a class="app-nav-item" href="/html/profile.html">
            <span class="app-nav-icon">👤</span>
            <span class="app-nav-label">Profile</span>
        </a>
        <a class="app-nav-item active" href="/html/settings.html">
            <span class="app-nav-icon">⚙️</span>
            <span class="app-nav-label">Settings</span>
        </a>
    </nav>
</div>

</body>
</html>
