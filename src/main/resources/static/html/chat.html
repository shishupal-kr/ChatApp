<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat - ChatApp</title>
    <link rel="stylesheet" href="/css/chat.css">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/chat.js" defer></script>
</head>
<body>

<div class="glass-chat-container">

    <!-- HEADER -->
    <div class="glass-header-wrapper">
        <div class="glass-header">

            <div class="profile-wrapper online" id="profileWrapper">
                <div class="profile-circle" id="profileCircle"></div>
            </div>

            <div class="chat-user-info">
                <span id="chatTitle" class="chat-username"></span>
            </div>

        </div>
    </div>

    <!-- MESSAGES -->
    <div id="messages" class="glass-messages"></div>

    <!-- INPUT -->
    <div class="glass-input">
        <input id="messageInput" class="glass-message-input" placeholder="Message...">
        <button class="glass-send-btn" onclick="sendMessage()">➤</button>
    </div>

</div>
</body>
</html>
