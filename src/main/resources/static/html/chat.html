<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chat - ChatApp</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/chat.css">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/chat.js" defer></script>
</head>
<body>

<div class="glass-chat-container">

    <!-- HEADER -->
    <div class="glass-header-wrapper">

        <!-- NORMAL HEADER -->
        <div id="normalHeader" class="glass-header">

            <span class="chat-back-btn" onclick="window.location.href='/html/friends.html'">←</span>

            <div class="profile-wrapper offline" id="profileWrapper">
                <div class="profile-circle" id="profileCircle"></div>
            </div>

            <div class="chat-user-info">
                <span id="chatTitle" class="chat-username"></span>
            </div>

        </div>

        <!-- SELECTION HEADER (Hidden by default) -->
        <div id="selectionHeader" class="selection-header" style="display: none;">

            <!-- LEFT SIDE (Back + Count) -->
            <div class="selection-left">
                <span class="selection-back" onclick="clearSelection()">←</span>
                <span id="selectionCount">1</span>
            </div>

            <!-- RIGHT SIDE (Actions) -->
            <div class="selection-actions">
                <span onclick="replySelected()">↩</span>
                <span onclick="editSelected()">✏</span>
                <span onclick="copySelected()">⧉</span>
                <span onclick="forwardSelected()">↪</span>
                <span onclick="deleteSelected()">🗑</span>
            </div>

        </div>


    </div>

    <!-- MESSAGES -->
    <div id="messages" class="glass-messages"></div>

    <!-- REPLY BAR (Above Input Like WhatsApp) -->
    <div id="replyBar" class="reply-bar" style="display: none;">
        <div class="reply-content">
            <span class="reply-label">Replying to</span>
            <span id="replyPreview" class="reply-preview-text"></span>
        </div>
        <span class="reply-close" onclick="cancelReply()">✕</span>
    </div>

    <!-- INPUT -->
    <div class="glass-input">
        <input id="messageInput" class="glass-message-input" placeholder="Message...">
        <button class="glass-send-btn" onclick="sendMessage()">➤</button>
    </div>

</div>

    <!-- FORWARD MODAL -->
    <div id="forwardModal" class="forward-modal" style="display:none;">
        <div class="forward-box">
            <h3>Forward to</h3>
            <div id="forwardUserList"></div>
            <button onclick="closeForwardModal()">Cancel</button>
        </div>
    </div>

</body>
</html>
