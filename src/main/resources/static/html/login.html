<!DOCTYPE html >
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - ChatApp</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/login.js" defer></script>
    <script src="/js/include.js"></script>
    <script>
        loadHeader();
    </script>
</head>
<body>

<div class="login-wrapper app-panel">

    <div class="login-card">
        <h2 class="login-title">ChatApp</h2>
        <p class="login-subtitle">Sign in to continue</p>

        <input id="username" class="login-input" type="text" placeholder="Username" autocomplete="username">
        <input id="password" class="login-input" type="password" placeholder="Password">

        <button class="login-button" onclick="login()">Login</button>
        <button class="register-button" onclick="goToRegister()">Create New Account</button>
    </div>

</div>

</body>
</html>
