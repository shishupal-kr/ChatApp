<!DOCTYPE html >
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - ChatApp</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/analytics.js"></script>
    <script src="/js/app-shell.js" defer></script>
    <script src="/js/login.js" defer></script>
    <script>
        // Auto-login check
        if (localStorage.getItem("token")) {
            window.location.href = "/html/chat.html";
        }
    </script>
</head>
<body class="edge">

<div class="auth-wrap shell shell-edge">

    <div class="login-card">
        <h2 class="login-title">ChatApp</h2>
        <p class="login-subtitle">Sign in to continue</p>

        <input id="username" class="login-input" type="text" placeholder="Username" autocomplete="username">
        <input id="password" class="login-input" type="password" placeholder="Password">

        <button class="login-button" onclick="login()">Login</button>
        <button class="auth-alt-btn" onclick="goToRegister()">Create New Account</button>

        <p id="loginMessage" style="color:#1f7a4d; font-size:13px; margin-top:10px;" aria-live="polite"></p>
        <p id="errorMessage" style="color:red; font-size:13px; margin-top:10px;" aria-live="polite"></p>
    </div>

</div>

</body>
</html>
