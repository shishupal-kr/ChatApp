<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profile - ChatApp</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/profile.css?v=20260321">
  <script src="/js/analytics.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app-shell.js" defer></script>
  <script src="/js/profile.js" defer></script>
</head>
<body class="edge" data-nav="profile">

<div class="profile-page shell shell-edge">

  <div class="profile-header topbar">
    <span onclick="goBack()" class="back-btn back">‹</span>
    <span class="profile-title top-title">Profile</span>
  </div>

  <div class="profile-main">

    <div class="avatar-box" id="avatarWrapper">
        <div class="status-ring" id="statusRing"></div>
        <div class="profile-avatar" id="profileAvatar">
            U
        </div>
    </div>

    <div class="profile-name" id="displayName">
      Full Name
    </div>

    <div class="profile-username" id="profileUsername">
      @username
    </div>

    <div class="profile-email" id="profileEmail" hidden>
      email@example.com
    </div>

  </div>
  <div data-app-nav></div>

</div>

</body>
</html>
