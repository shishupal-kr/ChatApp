<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register - ChatApp</title>
    <link rel="stylesheet" href="/chat-style.css">
</head>
<body>

<div class="login-wrapper">

    <div class="login-card">
        <h2>Create Account</h2>

        <input id="username" placeholder="Username">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <input id="confirmPassword" type="password" placeholder="Confirm Password">

        <button onclick="register()">Register</button>
        <button class="register-button" onclick="goToLogin()">Back to Login</button>

        <p id="errorMessage" style="color:red; font-size:13px; margin-top:10px;"></p>
    </div>

</div>

<script>

    function register() {

        var username = document.getElementById("username").value.trim();
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;
        var error = document.getElementById("errorMessage");

        error.innerText = "";

        // ================= VALIDATION =================

        if (!username || !email || !password || !confirmPassword) {
            error.innerText = "All fields are required";
            return;
        }

        if (username.length < 4) {
            error.innerText = "Username must be at least 4 characters";
            return;
        }

        if (!email.includes("@")) {
            error.innerText = "Invalid! email address should have @ symbol";
            return;
        }

        if (password.length < 6) {
            error.innerText = "Password must be at least 6 characters";
            return;
        }

        if (password !== confirmPassword) {
            error.innerText = "Passwords do not match";
            return;
        }

        // ================= API CALL =================

        fetch("/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Registration failed");
                }
                return response.text();
            })
            .then(() => {
                alert("Registration successful! Please login.");
                window.location.href = "/login.html";
            })
            .catch(() => {
                error.innerText = "Username or email may already exist";
            });
    }

    function goToLogin() {
        window.location.href = "/login.html";
    }

</script>

</body>
</html>
