<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, Arial;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: #4facfe;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>No Internet Connection</h2>
    <p>Please check your network and try again</p>
    <button onclick="retry()">Retry</button>
</div>

<script>
    function retry() {
        window.location.href = "https://chatapp-o2v7.onrender.com";
    }
</script>

</body>
</html>
